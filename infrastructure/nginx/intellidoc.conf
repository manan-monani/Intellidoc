# ============================================================
# IntelliDoc — Nginx Reverse Proxy Configuration
# ============================================================
# Nginx sits in front of FastAPI and serves the React frontend.
#
# What is a Reverse Proxy?
#   Think of it as a receptionist:
#   - All traffic comes to Nginx first (port 80/443)
#   - API requests (/api/*) → forwarded to FastAPI (port 8000)
#   - Everything else → React frontend static files
#
# Benefits:
#   - SSL termination (HTTPS)
#   - Load balancing (multiple backend servers)
#   - Static file serving (faster than Python)
#   - Security (hides backend details)
#   - Caching
# ============================================================

server {
    listen 80;
    server_name _;  # Replace with your domain

    # ── Redirect HTTP → HTTPS ──────────────────────────────
    # Uncomment when SSL is set up:
    # return 301 https://$server_name$request_uri;

    # ── API Proxy ──────────────────────────────────────────
    # Forward /api/* requests to FastAPI backend
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for ML processing (can take 30s+)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;

        # WebSocket support (for real-time updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── Health Check Proxy ─────────────────────────────────
    location /health {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }

    # ── API Docs Proxy ─────────────────────────────────────
    location /docs {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
    }

    # ── Frontend Static Files ──────────────────────────────
    # Serve the React build output
    location / {
        root /var/www/intellidoc;
        index index.html;
        try_files $uri $uri/ /index.html;
        # ^ Single Page App: serve index.html for all routes
        #   React Router handles client-side routing
    }

    # ── Static Asset Caching ───────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root /var/www/intellidoc;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── File Upload Size ───────────────────────────────────
    client_max_body_size 50M;

    # ── Security Headers ───────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
